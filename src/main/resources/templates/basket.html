<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Basket</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{navbar :: navbar}"></div>

    <div class="basket-body">
        <h1>Shopping Basket</h1>
        <p id="basket-empty-message" th:style="${basketCount == 0} ? '' : 'display:none;'">Your basket is empty.</p>

        <div class="basket">
            <div class="basket-items">
                <div th:each="item : ${basketItems}" class="basket-item" th:attr="data-product-id=${item.product.id}">
                    <form th:action="@{/basket/remove/{id}(id=${item.product.id})}" method="post" class="basket-item-delete-form" data-basket-action-form>
                        <button type="submit" class="basket-item-delete">Delete</button>
                    </form>
                    <div class="basket-item-image"><img th:src="@{/images/{file}(file=${item.product.imageUrl})}"></div>
                    <div class="basket-item-body">
                        <p th:text="${item.product.title}">Item</p>
                        <p th:text="'€' + ${item.product.price}">€0.00</p>
                        <div class="quantity">
                            <form th:action="@{/basket/decrement/{id}(id=${item.product.id})}" method="post" style="margin: 0;" data-basket-action-form>
                                <button type="submit" class="quantity-box">-</button>
                            </form>
                            <div th:text="${item.quantity}" class="quantity-box js-item-quantity" style="width: 35px; border-radius: 0;">0</div>
                            <form th:action="@{/basket/increment/{id}(id=${item.product.id})}" method="post" style="margin: 0;" data-basket-action-form>
                                <button type="submit" class="quantity-box">+</button>
                            </form>
                            <p th:text="'€' + ${item.subtotal}" class="js-item-subtotal" style="margin-top: 5px; margin-bottom: 0; margin-left: 350px; font-weight: 600;">€0.00</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="order-summary">
                <p style="margin: 30px 30px 0px;">Order Summary</p>

                <div class="order-summary-footer">
                    <p>Subtotal</p>
                    <p id="basket-subtotal" th:text="'€' + ${subTotal}" style="color: black;">€0.00</p>
                    <p>Shipping</p>
                    <p id="basket-shipping" th:text="${basketCount == 0} ? '' : '€' + ${shipping}" style="color: black;"></p>
                    <p>Total</p>
                    <p id="basket-total" th:text="${basketCount == 0} ? '€0.00' : '€' + ${total}" style="color: black;">€0.00</p>
                    <button id="basket-checkout-btn" th:style="${basketCount == 0} ? 'display:none;' : ''" class="basket-checkout">Proceed to Checkout</button>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/basket.js}"></script>
</body>
</html>
