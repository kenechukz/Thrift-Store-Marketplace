<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title></title>
</head>
<body>
    <div th:fragment="navbar" class="topnav">
        <div class="topnav-main">
            <a th:classappend="${path == '/home' or path == '/'} ? ' active' : ''" href="/home">Home</a>
            <a th:classappend="${path == '/catalogue'} ? ' active' : ''" href="/catalogue">Catalogue</a>
            <a th:if="${isUser}" th:classappend="${path == '/basket'} ? ' active' : ''" href="/basket" class="basket-nav-link">
                Basket
                <span id="basket-nav-count" class="basket-nav-count"
                      th:classappend="${basketNavCount == 0} ? ' hidden' : ''"
                      th:text="${basketNavCount}">0</span>
            </a>
            <a th:if="${isUser}" th:classappend="${path == '/orders'} ? ' active' : ''" href="/orders">Orders</a>
            <a th:if="${isAdmin}" th:classappend="${path == '/admin' or path == '/admin/products' or path == '/admin/orders'} ? ' active' : ''" href="/admin">Admin</a>
        </div>
        <form action="/logout" method="post" class="logout-form">
            <button type="submit" class="logout-button">Logout</button>
        </form>
    </div>
</body>
</html>
