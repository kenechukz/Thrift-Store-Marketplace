<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title></title>
</head>
<body>
    <div th:fragment="navbar" class="topnav">
        <img th:src="@{/images/image.png}" alt="Logo">
        <a th:classappend="${path == '/home' or path == '/'} ? ' active' : ''" href="/home">Home</a>
        <a th:classappend="${path == '/catalogue'} ? ' active' : ''" href="/catalogue">Catalogue</a>
        <a th:classappend="${path == '/basket'} ? ' active' : ''" href="/basket">Basket</a>
        <a th:classappend="${path == '/orders'} ? ' active' : ''" href="/orders">Orders</a>
        <form action="/logout" method="post" class="logout-form">
            <button type="submit" class="logout-button">Logout</button>
        </form>
    </div>
</body>
</html>
