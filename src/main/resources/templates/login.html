<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
    <div class="login-shell">
        <div class="login-brand">
            <p class="login-eyebrow">Marketplace</p>
            <h1>Welcome back</h1>
            <p class="login-subtitle">Sign in to view your orders, basket, and saved items.</p>
        </div>

        <form id="loginForm" action="/login" class="auth-panel" method="post">
            <fieldset class="account-type-picker">
                <div class="account-type-options">
                    <input id="loginUserType" type="radio" name="roleTypeChoice" value="USER" data-role-choice checked>
                    <label for="loginUserType">User</label>
                    <input id="loginAdminType" type="radio" name="roleTypeChoice" value="ADMIN" data-role-choice>
                    <label for="loginAdminType">Admin</label>
                </div>
            </fieldset>
            <input type="hidden" name="roleType" value="USER" data-role-target>

            <div class="login-card">
                <div class="login-form">
                    <p th:if="${error}" class="auth-error" th:text="${error}">Authentication failed</p>

                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" required>

                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Enter your password" required>

                    <div class="login-form-row">
                        <label class="checkbox-label" for="rememberMe">
                            <input id="rememberMe" name="rememberMe" type="checkbox">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="login-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="add-to-basket login-submit">Sign in</button>
                </div>

                <p class="login-footer">
                    New here?
                    <a th:href="@{/register}" class="login-link">Create an account</a>
                </p>
            </div>
        </form>
    </div>
    <script th:src="@{/js/auth_role.js}"></script>
</body>
</html>
