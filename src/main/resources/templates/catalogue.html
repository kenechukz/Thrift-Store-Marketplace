<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{navbar :: navbar}"></div>
    <h1 th:text="${message}">Placeholder</h1>
    <div class="catalogue-body">
        <div class="catalogue-items-container">
            <div class="catalogue-item-card">
                <div class="catalogue-item-image"></div>
                <p th:text="${item_name}">Item</p>
                <p th:text="${price}">Placeholder</p>
                <button>Add to Basket</button>
            </div>
            <div class="catalogue-item-card"></div>
            <div class="catalogue-item-card"></div>
            <div class="catalogue-item-card"></div>
            <div class="catalogue-item-card"></div>
            <div class="catalogue-item-card"></div>
            <div class="catalogue-item-card"></div>
            <div class="catalogue-item-card"></div>
            <div class="catalogue-item-card"></div>
            <div class="catalogue-item-card"></div>
            <div class="catalogue-item-card"></div>
            <div class="catalogue-item-card"></div>
        </div>
    </div>
</body>
</html>
