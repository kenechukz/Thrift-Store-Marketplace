<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{navbar :: navbar}"></div>
    <div class="catalogue-body">
        <h1 th:text="${message}">Placeholder</h1>
        <div id="catalogue-items-container">
            <div th:each="product : ${products}" class="catalogue-item-card" th:attr="data-id=${product.id}">
                <div class="catalogue-item-image"><img th:src="@{'/images/' + ${product.imageUrl}}" ></div>
                <p th:text="${product.title}">Item</p>
                <p th:text="'€' + ${product.price}">€0.00</p>
                <button class="add-to-basket">Add to Basket</button>
            </div>
        </div>
    </div>
    <script th:src="@{/js/add_to_basket.js}"></script>
</body>
</html>
