<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{navbar :: navbar}"></div>
    <div class="catalogue-body">
        <h1 th:text="${message}">Placeholder</h1>
        <div id="catalogue-items-container">
            <script th:inline="javascript">
                const products = /*[[${products}]]*/ [];
                const container = document.getElementById("catalogue-items-container");

                products.forEach(product => {
                    const card = document.createElement("div");
                    card.classList.add("catalogue-item-card");

                    card.innerHTML = `
                        <div class="catalogue-item-image"></div>
                        <p>${product.title}</p>
                        <p>€${product.price}</p>
                        <button class="add-to-basket">Add to Basket</button>
                    `;

                    container.appendChild(card);
                    const button = card.querySelector(".add-to-basket")

                    card.addEventListener("click", () => {
                        window.location.href = `/products/${product.id}`;
                        console.log(product.id);
                    })
                    button.addEventListener("click", (e) => {
                        e.stopPropagation();
                        console.log("Added item to cart!")
                    })
                });
            </script>
        </div>
    </div>
    <script th:src="@{/js/add_to_basket.js}"></script>
</body>
</html>
