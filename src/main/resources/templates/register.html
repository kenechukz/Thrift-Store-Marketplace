<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
    <div class="login-shell">
        <div class="login-brand">
            <p class="login-eyebrow">Marketplace</p>
            <h1>Create account</h1>
            <p class="login-subtitle">Set up your account to start buying and tracking orders.</p>
        </div>

        <form id="registerForm" class="auth-panel" method="post">
            <fieldset class="account-type-picker">
                <div class="account-type-options">
                    <input id="registerUserType" type="radio" name="roleTypeChoice" value="USER" data-role-choice checked>
                    <label for="registerUserType">User</label>
                    <input id="registerAdminType" type="radio" name="roleTypeChoice" value="ADMIN" data-role-choice>
                    <label for="registerAdminType">Admin</label>
                </div>
            </fieldset>
            <input type="hidden" name="roleType" value="USER" data-role-target>

            <div class="login-card">
                <div class="login-form">
                    <p th:if="${error}" class="auth-error" th:text="${error}">Registration failed</p>

                    <div class="auth-form-split">
                        <div>
                            <label for="firstName">First name</label>
                            <input id="firstName" name="firstName" type="text" placeholder="John" required>
                        </div>
                        <div>
                            <label for="lastName">Last name</label>
                            <input id="lastName" name="lastName" type="text" placeholder="Doe" required>
                        </div>
                    </div>

                    <label for="registerEmail">Email</label>
                    <input id="registerEmail" name="email" type="email" placeholder="you@example.com" required>

                    <label for="registerPassword">Password</label>
                    <input id="registerPassword" name="password" type="password" placeholder="Create a password" required>

                    <label for="confirmPassword">Confirm password</label>
                    <input id="confirmPassword" name="confirmedPassword" type="password" placeholder="Repeat your password" required>

                    <label class="checkbox-label" for="termsAccepted">
                        <input id="termsAccepted" name="termsAccepted" type="checkbox" required>
                        <span>I agree to the terms and privacy policy</span>
                    </label>

                    <button type="submit" class="add-to-basket login-submit">Create account</button>
                </div>

                <p class="login-footer">
                    Already have an account?
                    <a th:href="@{/login}" class="login-link">Sign in</a>
                </p>
            </div>
        </form>
    </div>
    <script th:src="@{/js/auth_role.js}"></script>
</body>
</html>
