<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="height: 1500px">
    <div th:replace="~{navbar :: navbar}"></div>
    <div class="product">

        <div class="product-body">
            <div class="product-image"><img th:src="@{'/images/' + ${product.imageUrl}}" ></div>
            <div class="product-text">
                <h1 th:text="${product.title}">Item</h1>
                <p th:text="'€' + ${product.price}">€0.00</p>
                <hr>
                <h2>Description</h2>
                <p th:text="${product.description}" style="margin-bottom: 16px ">Template</p>
                <hr>
                <div class="product-metadata">
                    <div class="product-metadata-top">
                        <p>Condition</p>
                        <p>Size</p>
                        <p th:text="${condition}">Good</p>
                        <p th:text="${product.size}">M</p>
                    </div>
                    <div class="product-metadata-bottom">
                        <p class="grey-text">Material</p>
                        <p th:text="${product.material}">Leather</p>
                    </div>
                </div>
                <hr>
                <button th:if="${isUser}" class="product-add-to-basket" th:attr="data-id=${product.id}">Add to Basket</button>
                <a th:if="${isAdmin}" th:href="@{/admin/product/{id}(id=${product.id})}" class="product-add-to-basket">Manage Product</a>
                <div class="shipping-info">
                    <div class="info-box">
                        <p>No returns</p>
                        <p class="grey-text">Unless item not as expected</p>
                    </div>
                    <div class="info-box">
                        <p>Fast Shipping</p>
                        <p class="grey-text">2-3 Days</p>
                    </div>
                    <div class="info-box">
                        <p>Authentic</p>
                        <p class="grey-text">Verified</p>
                    </div>

                </div>
            </div>

        </div>
        <div class="other-image-views">
            <div class="product-image-view"></div>
            <div class="product-image-view"></div>
            <div class="product-image-view"></div>
            <div class="product-image-view"></div>

        </div>
    </div>
    <h2>You May Also Like...</h2>
    <div class="recommended-products">
        <div th:each="rec : ${recommended_products}" class="catalogue-item-card" th:attr="data-id=${rec.id}">
            <div class="catalogue-item-image"><img th:src="@{/images/{imageUrl}(imageUrl=${rec.imageUrl})}"></div>
            <p th:text="${rec.title}">Item</p>
            <p th:text="'€' + ${rec.price}">€0.00</p>
            <button th:if="${isUser}" class="add-to-basket">Add to Basket</button>
            <a th:if="${isAdmin}" th:href="@{/admin/product/{id}(id=${rec.id})}" class="add-to-basket">Manage Product</a>
        </div>
    </div>
    <script th:src="@{/js/add_to_basket.js}"></script>
</body>
</html>
