<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{navbar :: navbar}"></div>

    <div class="home-body">
        <div class="home-hero">
            <h1 class="home-title">Thrift Store Marketplace</h1>
            <p class="home-description">Find unique second-hand treasures, to transform your wardrobe, vibe and lifestyle!</p>
        </div>
        <h2 th:text="${message}">Placeholder</h2>
        <div class="items-container">
            <div th:each="product : ${products}" class="item-card" th:attr="data-id=${product.id}">
                <div class="item-image">
                    <img th:src="@{'/images/' + ${product.imageUrl}}" alt="Product image">
                </div>
                <p class="item-name" th:text="${product.title}">Item</p>
                <p class="item-price" th:text="'€' + ${product.price}">€0.00</p>
                <button th:if="${isUser}" class="add-to-basket">Add to Basket</button>
                <a th:if="${isAdmin}" th:href="@{/admin/product/{id}(id=${product.id})}" class="add-to-basket">Manage Product</a>
            </div>
        </div>
    </div>
    <script th:src="@{/js/add_to_basket.js}"></script>


</body>
</html>
