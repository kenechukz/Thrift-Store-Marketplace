<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{navbar :: navbar}"></div>

    <div class="home-body">
        <h1 th:text="${message}">Placeholder</h1>
        <div class="items-container">
            <script>
                for (let i = 1; i <= 3; i++){
                    document.write(`
                        <div class="item-card">
                            <div class="item-image">Image</div>
                            <p class="item-name">Item ${i}</p>
                            <p class="item-price">€0.00</p>
                            <button class="add-to-basket">Add to Basket</button>
                        </div>
                    `)
                }
            </script>
        </div>
    </div>
    <script th:src="@{/js/add_to_basket.js}"></script>


</body>
</html>
