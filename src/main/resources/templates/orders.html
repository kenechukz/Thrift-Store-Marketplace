<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Orders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{navbar :: navbar}"></div>

    <div class="orders-body">
        <h1>Order History</h1>

        <div class="orders-list">
            <p th:if="${#lists.isEmpty(orders)}">No orders yet.</p>

            <div th:each="order : ${orders}" class="order-card">
                <div class="order-header">
                    <div class="order-header-top">
                        <span class="order-id" th:text="'Order #' + ${order.orderNumber}">Order #0000</span>
                        <span class="order-status" th:text="${order.orderStatus}">PAID</span>
                    </div>
                    <div class="order-header-meta">
                        <span class="order-date" th:text="'Date: ' + ${#temporals.format(order.date, 'dd/MM/yyyy HH:mm')}">Date: 01/01/2026 12:00</span>
                        <span class="order-total" th:text="'Total: €' + ${#numbers.formatDecimal(order.total, 1, 2)}">Total: €0.00</span>
                    </div>
                </div>

                <div class="order-items">
                    <div th:each="item, itemStat : ${order.orderItems}">
                        <div class="order-item">
                            <div class="order-item-image">
                                <img th:src="@{/images/{file}(file=${item.product.imageUrl})}" th:alt="${item.product.title}">
                            </div>
                            <div class="order-item-details">
                                <p class="order-item-name" th:text="${item.product.title}">Item</p>
                                <p class="order-item-qty" th:text="'Qty: ' + ${item.quantity}">Qty: 1</p>
                            </div>
                            <p class="order-item-price" th:text="'€' + ${#numbers.formatDecimal(item.unitPrice * item.quantity, 1, 2)}">€0.00</p>
                        </div>
                        <hr class="order-item-divider" th:if="${!itemStat.last}">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
